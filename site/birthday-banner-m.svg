<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6E3FD6"/>
      <stop offset=".55" stop-color="#F4622A"/>
      <stop offset="1" stop-color="#FFC531"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".45" r=".6">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bRed" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FF8A80"/><stop offset="1" stop-color="#E53950"/></radialGradient>
    <radialGradient id="bYel" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FFF0A6"/><stop offset="1" stop-color="#FFB300"/></radialGradient>
    <radialGradient id="bBlu" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#9BE3FF"/><stop offset="1" stop-color="#2AA7E8"/></radialGradient>
    <radialGradient id="bGrn" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#C6FFB0"/><stop offset="1" stop-color="#43C463"/></radialGradient>
    <radialGradient id="bPnk" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FFC2E8"/><stop offset="1" stop-color="#F0399B"/></radialGradient>
    <radialGradient id="bPur" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#D9C8FF"/><stop offset="1" stop-color="#8A5CF6"/></radialGradient>
    <g id="balloon">
