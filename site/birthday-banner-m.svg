    <rect x="420" y="120" width="18" height="10" rx="2" fill="#8CE2FF" transform="rotate(-35 429 125)"/>
    <rect x="640" y="340" width="18" height="10" rx="2" fill="#FF9ED1" transform="rotate(50 649 345)"/>
    <rect x="300" y="900" width="18" height="10" rx="2" fill="#B6FF9C" transform="rotate(-20 309 905)"/>
    <rect x="760" y="820" width="18" height="10" rx="2" fill="#FFE066" transform="rotate(35 769 825)"/>
    <rect x="120" y="1100" width="18" height="10" rx="2" fill="#fff" transform="rotate(-50 129 1105)"/>
    <rect x="520" y="1250" width="18" height="10" rx="2" fill="#8CE2FF" transform="rotate(15 529 1255)"/>
    <rect x="800" y="1350" width="18" height="10" rx="2" fill="#FF9ED1" transform="rotate(-25 809 1355)"/>
    <circle cx="200" cy="600" r="7" fill="#fff" opacity=".8"/>
