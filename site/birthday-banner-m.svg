    <use href="#balloon" fill="url(#bPur)" color="#8A5CF6" transform="translate(790 40) rotate(10) scale(.9)"/>
    <use href="#balloon" fill="url(#bGrn)" color="#43C463" transform="translate(690 -10) rotate(-8) scale(.8)"/>
