    <path d="M5 -8 q14 -12 28 0 t27 0 t27 0 t28 0 v8 q-14 12 -28 0 t-27 0 t-27 0 t-28 0z" fill="#E8DCFF"/>
    <g stroke="#fff" stroke-width="5" stroke-linecap="round"><line x1="30" y1="-18" x2="30" y2="-42"/><line x1="60" y1="-18" x2="60" y2="-46"/><line x1="90" y1="-18" x2="90" y2="-42"/></g>
    <g fill="#FFD23F"><ellipse cx="30" cy="-50" rx="6" ry="10"/><ellipse cx="60" cy="-54" rx="6" ry="10"/><ellipse cx="90" cy="-50" rx="6" ry="10"/></g>
    <g fill="#FF6A00"><ellipse cx="30" cy="-52" rx="3" ry="5"/><ellipse cx="60" cy="-56" rx="3" ry="5"/><ellipse cx="90" cy="-52" rx="3" ry="5"/></g>
  </g>
  <g transform="translate(680 1440) scale(.9)">
    <ellipse cx="50" cy="86" rx="80" ry="13" fill="#000" opacity=".15"/>
    <rect x="-20" y="12" width="140" height="74" rx="10" fill="#2AA7E8"/>
    <rect x="-28" y="0" width="156" height="26" rx="8" fill="#5BC8FF"/>
    <rect x="38" y="0" width="24" height="86" fill="#FFE066"/>
    <rect x="-28" y="6" width="156" height="14" fill="#FFE066"/>
    <path d="M50 2 c-26 -30 -50 -14 -24 2 c-26 10 -6 22 24 -2 M50 2 c26 -30 50 -14 24 2 c26 10 6 22 -24 -2" fill="#FFE066" stroke="#F4B400" stroke-width="2"/>
